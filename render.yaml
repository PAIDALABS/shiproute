services:
  - type: web
    name: shiproute
    runtime: python
    python: "3.11.0"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATALASTIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ALERT_WEBHOOK_URL
        sync: false
